# Served by nginxinc/nginx-unprivileged (listens on 8080; runs as uid 101, non-root).
# TASK-INFRA-001. Static SPA with client-side routing fallback + same-origin API proxy.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No inline scripts/styles in the Vite build (verified: dist/index.html has only
    # external <script type="module" src=...> and <link rel="stylesheet">), so a CSP with
    # no 'unsafe-inline' works.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Docker's embedded DNS. A variable + resolver makes nginx resolve "api" lazily per
    # request instead of once at config load, so this container still starts (and serves
    # static files) even when the api container/network isn't present yet - e.g. standalone
    # `docker run`, where a literal `proxy_pass http://api:8000` makes nginx refuse to start
    # at all with "host not found in upstream" (reproduced during TASK-INFRA-001 testing).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api:8000;
        # No URI part: with a variable upstream nginx would send a URI part literally
        # (every request became "/api/"); without one the original request URI is kept.
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback: unmatched paths (client-side routes) serve index.html;
    # real static assets are still served directly when they exist.
    location / {
        try_files $uri /index.html;
    }
}
