[project]
name = "analyzer-backend"
version = "0.1.0"
description = "AI-Driven Autonomous Business Analyzer - backend (FastAPI modular monolith)"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.54.0,<0.55",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "sqlalchemy>=2.0.54,<2.1",
  "alembic>=1.20.0,<1.21",
  "psycopg[binary]>=3.3.6,<3.4",
  "argon2-cffi>=25.1.0,<26",
  "cryptography>=50.0.1,<51",
  "httpx>=0.28.1,<0.29",
  "polars>=1.44.2,<2",
  "pyarrow>=25.0.1,<26",
  "charset-normalizer>=3.5.1,<4",
  "python-calamine>=0.8.2,<0.9",
  "python-multipart>=0.0.32,<0.1",
  "statsmodels>=0.15.0,<0.16",
  "scikit-learn>=1.9.1,<1.10",
  "numpy>=2.5.3,<3",
  "pandas>=3.0.6,<4",
  "duckdb>=1.5.5,<1.6",
  "sse-starlette>=3.4.11,<3.5",
  "opentelemetry-api>=1.45.0,<1.46",
  "opentelemetry-sdk>=1.45.0,<1.46",
  "prometheus-client>=0.26.0,<0.27",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "mypy>=2.3.1,<3",
  "ruff>=0.16.9,<0.17",
  "import-linter>=2.15,<3",
  "hypothesis>=6.168.3,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
# pyarrow ships no type information (no py.typed); treat it as Any at the boundary.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ML boundary libraries ship no type information (ADR-0017); numpy is typed.
module = ["pandas", "pandas.*", "sklearn", "sklearn.*", "statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "integration: needs real services (PostgreSQL etc.)",
  "llm: needs a running local LLM",
  "slow: long-running tests",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is a foundation layer and must not import delivery code"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "domain contracts stay free of web and database frameworks"
type = "forbidden"
source_modules = [
  "app.data.domain",
  "app.data.profiling.domain",
  "app.data.understanding.domain",
  "app.data.semantic.domain",
  "app.planner.domain",
  "app.ml.domain",
  "app.evidence.domain",
  "app.validator.domain",
  "app.dashboard.domain",
  "app.tools.domain",
]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "analytics engine, compiler and services stay free of web, ORM and tool plumbing"
type = "forbidden"
source_modules = ["app.analytics.domain", "app.analytics.sql", "app.analytics.services"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "app.api", "app.main", "app.tools"]
# app.core.errors itself imports fastapi (error handlers), so only direct imports are checked.
allow_indirect_imports = true
