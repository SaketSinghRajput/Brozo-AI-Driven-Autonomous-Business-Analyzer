# Prod profile only (compose.prod.yml, TASK-INFRA-007). api/worker sit on an internal network with
# no route out; this server block is their single egress: host Ollama, inference endpoints only.
# Listens on the proxy container's networks; the port is never published to the host.
server {
    listen 11434;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;  # chat requests carry context, not files

    # Inference/read endpoints the gateway and readiness probe use. Model management
    # (/api/pull, /api/delete, /api/create, /api/push, ...) is refused.
    location ~ ^/api/(chat|tags|version|show)$ {
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host localhost;  # Ollama sees a local client
        proxy_http_version 1.1;
        proxy_buffering off;              # streamed tokens
        proxy_read_timeout 600s;
    }

    location / {
        return 403;
    }
}
