# Reverse proxy + static SPA (TASK-INFRA-006). Owned by infra; mounted over the frontend image's
# /etc/nginx/conf.d/default.conf (frontend/nginx.conf stays the image default for standalone runs).
# Served by nginxinc/nginx-unprivileged: listens on 8080 as uid 101.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Docker's embedded DNS; resolving "api" per request lets nginx start before the api exists.
    resolver 127.0.0.11 valid=10s;

    # Body limits mirror the backend (app/security/middleware.py): 1 MiB for ordinary API calls
    # (APP_SECURITY__MAX_BODY_BYTES) and the upload limit for dataset uploads
    # (APP_STORAGE__MAX_UPLOAD_BYTES, default 200 MiB). Keep them in sync when changing either;
    # the backend re-checks both, so nginx is only the coarse outer gate.
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location ^~ /api/v1/datasets {
        set $api_upstream api:8000;
        client_max_body_size 200m;
        # Stream the multipart body to the api instead of spooling it to nginx temp files.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://$api_upstream;
    }

    # SSE chat stream (ADR-0020): events must reach the browser as they are produced, and a
    # local 7B model can take minutes between tokens on CPU fallback.
    location ^~ /api/v1/chat {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /api/ {
        set $api_upstream api:8000;
        # No URI part: with a variable upstream nginx keeps the original request URI.
        proxy_pass http://$api_upstream;
        proxy_read_timeout 120s;
    }

    # Only /api/ reaches the api: /metrics (and anything else outside /api/) is never proxied.

    location / {
        try_files $uri /index.html;
    }
}
